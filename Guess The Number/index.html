<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess The Number</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="heading">
            <h1>The <i>Guess The Number</i> Game</h1>
        </div>
        <div class="gameScreen">
            <div class="text">
                <h2>We have generated a number between 1 to 100... Can you <i>GUESS</i> it?? 😏😏</h2>
            </div>
            <div class="getNumber">
                <div class="numFields">
                    <label for="num">Enter Number Here: </label>
                    <input type="number" id="num">
                </div>
                <div class="btn">
                    <button type="button">Check Number</button>
                </div>
            </div>
            <div class="hintOResult">
            
            </div>
            <div class="resetGame">

            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>

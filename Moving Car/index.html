<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Animation - Web Project</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="sky">
            <div class="grass"></div>
            <div class="track"></div>
            <div class="carBox">
                <div class="car">
                    <div class="wheel wheel1">
                        <img src="imgs/wheel.png" alt="">
                    </div>
                    <div class="wheel wheel2">
                        <img src="imgs/wheel.png" alt="">
                    </div>
                </div>
            </div>
        </div>        
    </div>
    <div class="start" id="start">
        <button>Start Car Animation</button>
    </div>

    <script src="script.js"></script>
</body>
</html>

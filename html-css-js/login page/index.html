<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThinkHub FAMT - College's Own Forum</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cotnainer">
        <div class="loginform">
            <div class="left">
                <div class="heading">
                    <h2>Login</h2>
                    <hr>
                </div>
                <div class="credentials">
                    <div class="userEmail">
                        <img src="imgs/email.png" alt="">
                        <input type="email" name="email" id="loginEmail" placeholder="Enter your email here">
                    </div>
                    <div class="pass">
                        <img src="imgs/pass.png" alt="">
                        <input type="password" name="password" id="loginPass" placeholder="Enter your password here">
                    </div>
                    <div class="forgotPassBtn">
                        <button>Forgot Password?</button>
                    </div>
                </div>

                <div class="loginBtn">
                    <button>Login</button>
                </div>
                <div class="signUpPrompt">
                    Don't have an account? <a href="#">Signup now!</a>
                </div>
            </div>
            <div class="right">
                <img src="imgs/sideimg.png" alt="">
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
